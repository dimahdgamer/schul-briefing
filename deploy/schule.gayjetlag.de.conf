# nginx-Seite für schule.gayjetlag.de hinter dem Cloudflare Tunnel.
#
# Weg: Cloudflare (HTTPS) -> cloudflared -> nginx :80 -> App 127.0.0.1:8470
# HTTPS macht Cloudflare, deshalb braucht es hier kein Zertifikat.
#
#   sudo cp schule.gayjetlag.de.conf /etc/nginx/sites-available/schule
#   sudo ln -s /etc/nginx/sites-available/schule /etc/nginx/sites-enabled/schule
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # cloudflared erreicht "localhost" zuerst über IPv6, ohne diese Zeile
    # landet die Anfrage beim default_server
    listen [::]:80;
    server_name schule.gayjetlag.de;

    location / {
        proxy_pass http://127.0.0.1:8470;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Kommt immer über Cloudflare per HTTPS rein
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
