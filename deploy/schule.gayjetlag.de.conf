# nginx-Konfiguration für die Subdomain.
# Ablegen unter /etc/nginx/sites-available/ und nach sites-enabled verlinken,
# danach HTTPS mit: sudo certbot --nginx -d schule.gayjetlag.de

server {
    listen 80;
    listen [::]:80;
    server_name schule.gayjetlag.de;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8470;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Der Service Worker darf nie gecacht werden, sonst kommen Updates nicht an
    location = /sw.js {
        proxy_pass http://127.0.0.1:8470;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }
}
